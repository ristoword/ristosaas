name: DB Backup Verify

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  backup-and-dryrun:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.RISTOSAAS_DATABASE_URL }}
      BACKUP_DIR: ./storage/backups
      BACKUP_RETENTION_DAYS: 14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client tools (v18 — matches Railway server)
        run: |
          # Aggiungi il repository ufficiale PostgreSQL (PGDG) per avere pg_dump v18
          sudo apt-get install -y curl ca-certificates gnupg lsb-release
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          # Installa pg_dump v18 che corrisponde al server Railway
          sudo apt-get install -y postgresql-client-18

      - name: Validate secret presence
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "Missing secret RISTOSAAS_DATABASE_URL"
            exit 1
          fi

      - name: Run DB backup
        run: bash ./infra/scripts/db-backup.sh

      - name: Run restore dry-run
        run: bash ./infra/scripts/db-restore-dryrun.sh ./storage/backups/latest.dump

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: ./storage/backups/*.dump
          if-no-files-found: error
          retention-days: 14
